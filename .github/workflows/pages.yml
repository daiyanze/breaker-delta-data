# Build and deploy this instance's 浪尖雷达 / Breaker Delta site.
# This repo holds DATA only. The generator lives in the engine repo
# (daiyanze/breaker-delta); CI checks it out, builds the Node CLI bundle,
# and builds this repo's data with it. Deploys to this repo's GitHub Pages:
# https://daiyanze.github.io/breaker-delta-data/
# Requires Pages enabled in this repo's Settings (Source: GitHub Actions).
#
# 2026-11-15: build switched from Python (python -m radar.publish) to the
# Node CLI bundle (@breaker-delta/cli). Rollback: restore the setup-python
# + overlay + `python -m radar.publish` steps from git history.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out data repo
        uses: actions/checkout@v4
      - name: Check out engine repo
        uses: actions/checkout@v4
        with:
          repository: daiyanze/breaker-delta
          ref: main
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Breaker Delta CLI bundle
        working-directory: engine
        run: |
          npm ci
          npm run bundle
      - name: Generate site
        env:
          TS_BASE_URL: https://daiyanze.github.io/breaker-delta-data/
          TS_DATA_REPO: daiyanze/breaker-delta-data
        run: >-
          node engine/apps/cli/dist/breaker-delta.mjs
          --data-dir "$GITHUB_WORKSPACE"
          --root-dir "$GITHUB_WORKSPACE/engine"
          publish --out "$GITHUB_WORKSPACE/site"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
